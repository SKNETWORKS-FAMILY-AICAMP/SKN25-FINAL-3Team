# Korean patent specification drafting rules.
# Used by the future specification/composer agents.

version: 0.1.0
language: ko
purpose: specification_drafting_and_validation

sections:
  technical_field:
    korean_title: "기술분야"
    goal: "발명이 속하는 기술 분야를 간결하게 설명한다."
  background_art:
    korean_title: "배경기술"
    goal: "기존기술의 일반적 문제를 설명하되, 근거 없는 선행기술 단정은 피한다."
  problem_to_solve:
    korean_title: "해결하려는 과제"
    goal: "상담 state의 problem을 특허 문체로 재구성한다."
  means_for_solving:
    korean_title: "과제의 해결 수단"
    goal: "청구항 1의 핵심 구성과 invention_graph의 필수 관계를 반영한다."
  effects:
    korean_title: "발명의 효과"
    goal: "effect와 prior_art.difference_points 기반의 기술적 효과를 작성한다."
  brief_description_of_drawings:
    korean_title: "도면의 간단한 설명"
    goal: "drawings.figures를 도 번호별로 설명한다."
  detailed_description:
    korean_title: "발명을 실시하기 위한 구체적인 내용"
    goal: "구성요소, 참조부호, 데이터 흐름, 실시예를 일관되게 설명한다."

reference_expression_rules:
  first_mention:
    component_format: "{term}({reference_no})"
    example: "데이터 수집부(110)"
    rule: "구성요소가 최초 등장할 때는 가능하면 참조부호를 함께 쓴다."
  later_mention:
    preferred_prefixes:
      - "상기"
      - "전술한"
    example: "상기 데이터 수집부(110)"
    rule: "이후 동일 구성요소는 document_links.term_registry의 canonical_name을 기준으로 지칭한다."
  figure_reference:
    format: "도 {fig_no}"
    examples:
      - "도 1을 참조하면"
      - "도 2에 도시된 바와 같이"
  validation:
    - "'상기' 표현은 앞서 정의된 term_registry 항목을 가리켜야 한다."
    - "참조부호는 document_links.reference_numeral_map에 존재해야 한다."
    - "같은 참조부호가 서로 다른 구성요소에 배정되면 안 된다."

sentence_style:
  tone: "formal_patent"
  preferred_endings:
    - "~할 수 있다"
    - "~하도록 구성될 수 있다"
    - "~를 포함할 수 있다"
  avoid:
    - "혁신적인"
    - "완벽하게"
    - "무조건"
    - "법적으로 신규하다"
  uncertainty:
    rule: "선행기술조사 결과는 법적 확정 판단이 아니라 리스크/가능성으로 표현한다."

consistency_checks:
  - id: component_name_consistency
    description: "명세서 구성요소명이 claims/drawings/document_links와 일치하는지 확인한다."
  - id: support_for_claim_elements
    description: "청구항의 핵심 구성요소가 상세한 설명에 등장하는지 확인한다."
  - id: figure_description_coverage
    description: "drawings.figures의 각 도면이 도면의 간단한 설명에 포함되는지 확인한다."
  - id: reference_numeral_integrity
    description: "참조부호 누락/중복/오배정을 확인한다."
