# Drawing and reference numeral rules for patent document generation.

version: 0.1.0
language: ko
purpose: drawing_planning_and_validation

figure_types:
  system_architecture:
    description: "시스템/장치 구성요소와 연결관계를 표시한다."
    recommended_when:
      - "components가 2개 이상 존재"
      - "시스템항 또는 장치항이 생성될 예정"
  flowchart:
    description: "방법항의 단계 흐름을 표시한다."
    recommended_when:
      - "process_steps가 2개 이상 존재"
      - "방법항이 생성될 예정"
  data_flow:
    description: "입력 데이터, 처리, 출력 결과의 흐름을 표시한다."
    recommended_when:
      - "AI 분석/전처리/출력 흐름이 중요한 경우"
  model_structure:
    description: "AI 모델 내부 또는 학습/추론 구조를 표시한다."
    recommended_when:
      - "ai_usage가 핵심 차별점인 경우"

reference_numeral_policy:
  system_level_start: 100
  component_increment: 10
  preferred_examples:
    - number: "100"
      role: "전체 시스템"
    - number: "110"
      role: "제1 구성요소"
    - number: "120"
      role: "제2 구성요소"
  validation:
    - "동일 번호를 서로 다른 구성요소에 사용하지 않는다."
    - "동일 구성요소는 모든 도면/명세서에서 같은 번호를 사용한다."
    - "reference_numerals는 document_links.reference_numeral_map과 동기화되어야 한다."

linking_rules:
  figure_to_component:
    rule: "각 figure.components 항목은 consultation.components 또는 invention_graph.component_graph의 구성요소와 연결한다."
  claim_to_figure:
    rule: "청구항 핵심 구성요소가 도면에 표시되지 않으면 review flag를 남긴다."
  spec_to_figure:
    rule: "상세한 설명에서 도면을 언급할 때 '도 {fig_no}' 형식을 사용한다."

quality_checks:
  - id: figure_coverage
    description: "청구항/발명그래프의 필수 구성요소가 적어도 하나의 도면에 포함되는지 확인한다."
  - id: step_coverage
    description: "방법항의 핵심 단계가 flowchart 또는 data_flow 도면에 반영되는지 확인한다."
  - id: reference_numeral_sync
    description: "drawings.reference_numerals와 document_links.reference_numeral_map이 같은지 확인한다."
