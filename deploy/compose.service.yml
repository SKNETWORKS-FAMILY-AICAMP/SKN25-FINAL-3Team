services:
  patent-api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: patent-agent-api:latest
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_WORKERS: ${APP_WORKERS:-2}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://patent_app:${POSTGRES_PASSWORD}@postgres:5432/patent_ai}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ARTIFACT_ROOT: ${ARTIFACT_ROOT:-/app/artifacts}
      PATENTS_TEXT_DIR: ${PATENTS_TEXT_DIR:-/app/data/patents_txt}
    ports:
      - "${PATENT_API_PORT:-8000}:8000"
    volumes:
      - patent-artifacts:/app/artifacts
      - patent-data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-patent_ai}
      POSTGRES_USER: ${POSTGRES_USER:-patent_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  patent-artifacts:
  patent-data:
