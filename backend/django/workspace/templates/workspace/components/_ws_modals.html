{# workspace/templates/workspace/components/_ws_modals.html #}

<div id="claim-edit-modal" class="lf-modal-overlay">
    <div class="lf-modal-content">
        <div class="lf-modal-hd">
            <h3 class="lf-modal-title">특허 청구범위 수정</h3>
            <button id="close-claim-modal" class="lf-modal-close">&times;</button>
        </div>
        <div id="modal-claims-container" class="lf-modal-body">
            <p style="color: var(--lf-muted); text-align: center;">데이터를 불러오는 중입니다...</p>
        </div>
        <div class="lf-modal-ft">
            <button id="modal-save-btn" class="lf-btn-action lf-btn-action--primary">
                수정된 내용 저장
            </button>
        </div>
    </div>
</div>

<div id="process-map-modal" class="lf-modal-overlay">
    <div class="lf-modal-content">
        <div class="lf-modal-hd">
            <h3 class="lf-modal-title">특허 출원 파이프라인 진행도</h3>
            <button id="close-process-modal" class="lf-modal-close">&times;</button>
        </div>
        <div class="lf-process-graph" id="dag-container">
            </div>
        <div class="lf-modal-ft" style="text-align: center;">
            <p id="process-message" style="margin: 0; color: var(--lf-mid); font-size: 13px;">
                현재 단계를 진행 중입니다.
            </p>
        </div>
    </div>
</div>
