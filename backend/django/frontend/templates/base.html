<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}PYPI{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <style>
/* ═══════════════════════════════════════════════════════
   PYPI — Base Styles
   White Gold Law Firm Theme
═══════════════════════════════════════════════════════ */

/* ── CSS Variables (Light Theme) ─────────────────── */
:root {
  --bg:                 #ffffff;
  --bg-2:               #faf8f4;
  --bg-3:               #f4f0e8;
  --bg-card:            #faf8f4;
  --bg-input:           #ffffff;
  --bg-input-focus:     #fdf9f4;
  --gold:               #9a7840;
  --gold-lt:            #b8935a;
  --gold-d:             #7a5e2e;
  --cream:              #12100e;
  --mid:                #7c756e;
  --muted:              #b8b0a8;
  --border:             rgba(0,0,0,.08);
  --border-subtle:      rgba(0,0,0,.07);
  --border-focus:       rgba(154,120,64,0.5);
  --text-primary:       #12100e;
  --text-secondary:     #3d3830;
  --text-muted:         #7c756e;
  --color-primary:      #9a7840;
  --color-primary-glow: rgba(154,120,64,0.1);
  --color-secondary:    #b8935a;
  --radius-sm:          4px;
  --radius-md:          8px;
  --radius-lg:          12px;
  --transition:         all .2s cubic-bezier(.25,.46,.45,.94);
  --serif:              'DM Serif Display','Noto Serif KR',Georgia,serif;
  --sans:               'Pretendard Variable','Pretendard','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  /* 페이지별 alias — 모든 변수명이 동일한 폰트를 가리킴 */
  --lf-serif:           var(--serif);
  --lf-sans:            var(--sans);
  --la-serif:           var(--serif);
  --la-sans:            var(--sans);
}

/* ── Reset ────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text-primary);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: 'kern' 1, 'liga' 1;
  text-rendering: optimizeLegibility;
}

/* ── Light Theme Input ────────────────────────────── */
a { color: inherit; }
button { font-family: var(--sans); }

/* ── Language Switcher ────────────────────────────── */
.lang-switcher { position: relative; display: inline-flex; flex-direction: column; }
.lang-btn {
  display: flex; align-items: center; gap: 6px;
  background: transparent;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  font-family: var(--sans); font-size: 10px; font-weight: 500;
  letter-spacing: 1.2px; text-transform: uppercase;
  padding: .3rem .7rem; cursor: pointer;
  transition: var(--transition);
}
.lang-btn:hover { border-color: rgba(184,147,90,.35); color: var(--gold); }
.lang-dropdown {
  display: none;
  position: absolute; top: 100%; right: 0;
  margin-top: 4px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: .5rem;
  min-width: 160px;
  z-index: 999;
  box-shadow: 0 16px 48px rgba(0,0,0,.6);
}
/* 버튼↔드롭다운 사이 gap 없이 hover 유지 (before pseudo로 브릿지) */
.lang-switcher::before {
  content: ''; display: none;
  position: absolute; top: 100%; right: 0;
  width: 100%; height: 8px;
}
.lang-switcher:hover::before { display: block; }
.lang-switcher:hover .lang-dropdown,
.lang-switcher.open .lang-dropdown { display: block; }
.lang-option {
  display: flex; align-items: center; gap: 10px;
  padding: .5rem .75rem;
  border-radius: var(--radius-sm);
  text-decoration: none;
  color: var(--text-secondary);
  font-size: 12px; font-weight: 400;
  transition: var(--transition);
}
.lang-option:hover, .lang-option.active {
  background: rgba(154,120,64,.07); color: var(--text-primary);
}
.lang-flag { font-size: 14px; }
.lang-name { flex: 1; }
.lang-code { font-size: 9px; letter-spacing: 1px; color: var(--text-muted); }
.lang-option.active .lang-code { color: var(--gold); }

/* ── Dashboard Layout ─────────────────────────────── */
.dashboard-wrapper { min-height: 100vh; display: flex; flex-direction: column; }

.dashboard-nav {
  position: sticky; top: 0; z-index: 600;
  background: rgba(255,255,255,.96);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 40px; height: 64px; gap: 16px;
}
.nav-brand {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--serif); font-size: 15px; font-weight: 400;
  letter-spacing: 2.5px; text-transform: uppercase;
  color: var(--text-primary); text-decoration: none; flex-shrink: 0;
}
.brand-icon-sm {
  width: 28px; height: 28px;
  border: 1px solid rgba(154,120,64,.35);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--serif); font-style: normal; font-size: 10px; color: var(--gold);
}
.nav-user {
  display: flex; align-items: center; gap: 14px;
}
.user-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: rgba(184,147,90,.12);
  border: 1px solid rgba(184,147,90,.3);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--serif); font-size: 13px; color: var(--gold); font-weight: 400;
  flex-shrink: 0;
}
.user-email {
  font-size: 12px; color: var(--text-muted);
  font-weight: 300; letter-spacing: .2px;
}
.btn-logout {
  background: transparent;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  font-family: var(--sans); font-size: 10px; font-weight: 500;
  letter-spacing: 1.5px; text-transform: uppercase;
  padding: .3rem .8rem; cursor: pointer;
  transition: var(--transition);
}
.btn-logout:hover { border-color: rgba(239,68,68,.4); color: #f87171; }

/* ── unified app nav links ── */
.nav-links {
  display: flex; align-items: center; gap: 2px; flex: 1; margin: 0 24px;
}
.nav-link {
  padding: 5px 14px;
  font-size: 10.5px; font-weight: 500; letter-spacing: .8px;
  color: var(--text-muted); text-decoration: none;
  transition: color .18s, background .18s;
  border-radius: 3px;
}
.nav-link:hover { color: var(--text-primary); background: rgba(0,0,0,.04); }
.nav-link.active { color: var(--text-primary); font-weight: 600; }
.nav-link-divider { width: 1px; height: 14px; background: var(--border); margin: 0 6px; flex-shrink: 0; }
@media (max-width: 768px) { .nav-links { display: none; } }

.dashboard-content {
  flex: 1;
  max-width: 1100px; margin: 0 auto;
  padding: 3rem 40px 6rem; width: 100%;
}

/* ── Cards ────────────────────────────────────────── */
.welcome-card {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 2rem 2.5rem;
  backdrop-filter: blur(16px);
}
.welcome-text h2 {
  font-family: var(--serif);
  font-size: clamp(22px, 3vw, 32px);
  font-weight: 300; line-height: 1.3; color: var(--text-primary); margin-bottom: .5rem;
}
.welcome-text p {
  font-size: .9rem; font-weight: 300; color: var(--text-muted); line-height: 1.7;
}
.welcome-emoji { font-size: 2.5rem; }
.highlight { color: var(--gold); font-style: italic; }

.info-card {
  display: flex; align-items: flex-start; gap: 1.25rem;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 1.5rem 1.75rem;
  backdrop-filter: blur(16px);
  transition: var(--transition);
}
.info-card:hover { border-color: rgba(184,147,90,.2); }

/* ── Forms ────────────────────────────────────────── */
.form-group { display: flex; flex-direction: column; gap: .5rem; }
.form-label {
  font-size: .78rem; font-weight: 600; letter-spacing: .06em;
  color: var(--text-secondary); text-transform: uppercase;
}
.input-wrapper { position: relative; display: flex; align-items: center; }
.input-icon {
  position: absolute; left: .9rem;
  font-size: 1rem; pointer-events: none;
}
.input-wrapper input {
  width: 100%;
  padding: .75rem 1rem .75rem 2.6rem;
  background: var(--bg-input);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-family: var(--sans); font-size: .9rem; font-weight: 300;
  outline: none; transition: var(--transition);
}
.input-wrapper input:focus {
  background: var(--bg-input-focus);
  border-color: var(--border-focus);
  box-shadow: 0 0 0 3px var(--color-primary-glow);
}
.input-wrapper input::placeholder { color: var(--text-muted); font-size: .87rem; }

/* ── Buttons ──────────────────────────────────────── */
.btn-primary {
  display: inline-flex; align-items: center; gap: .5rem;
  padding: .8rem 2rem;
  background: var(--gold); border: none; border-radius: var(--radius-sm);
  color: #ffffff;
  font-family: var(--sans); font-size: .82rem; font-weight: 600;
  letter-spacing: 1.5px; text-transform: uppercase;
  cursor: pointer; text-decoration: none;
  transition: var(--transition); white-space: nowrap;
}
.btn-primary:hover { background: var(--gold-lt); letter-spacing: 1.8px; }
.btn-primary:disabled { opacity: .55; cursor: not-allowed; letter-spacing: 1.5px; }
.btn-arrow { transition: transform .2s; }
.btn-primary:hover .btn-arrow { transform: translateX(3px); }

/* ── Spinner ──────────────────────────────────────── */
.spinner {
  display: inline-block;
  width: 18px; height: 18px;
  border: 2px solid rgba(184,147,90,.25);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin .8s linear infinite;
  flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Auth Pages ───────────────────────────────────── */
.auth-page {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg);
  background-image: repeating-linear-gradient(
    -45deg, transparent 0px, transparent 40px,
    rgba(184,147,90,.012) 40px, rgba(184,147,90,.012) 41px
  );
  padding: 2rem;
}
.auth-card {
  width: 100%; max-width: 420px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 3rem 2.5rem;
  backdrop-filter: blur(24px);
}
.auth-brand { text-align: center; margin-bottom: 2rem; }
.auth-logo {
  display: inline-flex; align-items: center; gap: 10px;
  text-decoration: none; margin-bottom: .5rem;
}
.auth-logo-mark {
  width: 36px; height: 36px;
  border: 1px solid rgba(184,147,90,.3);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--serif); font-size: 12px; color: var(--gold);
}
.auth-logo-name {
  font-family: var(--serif); font-size: 16px; font-weight: 400;
  letter-spacing: 2.5px; text-transform: uppercase; color: var(--cream);
}
.auth-tagline {
  font-size: 11px; color: var(--text-muted); letter-spacing: .3px; font-weight: 300;
}
.auth-vline {
  width: 1px; height: 40px;
  background: linear-gradient(180deg, transparent, rgba(184,147,90,.4), transparent);
  margin: 0 auto 2rem;
}
.auth-h1 {
  font-family: var(--serif); font-size: 28px; font-weight: 300;
  color: var(--cream); text-align: center; margin-bottom: .5rem;
}
.auth-sub {
  font-size: 12px; color: var(--text-muted); font-weight: 300;
  text-align: center; margin-bottom: 2rem; line-height: 1.6;
}
.auth-error {
  background: rgba(239,68,68,.08);
  border: 1px solid rgba(239,68,68,.25);
  border-radius: var(--radius-sm);
  color: #fca5a5; font-size: .85rem;
  padding: .75rem 1rem; margin-bottom: 1.5rem;
  display: flex; align-items: center; gap: .5rem;
}
.auth-form { display: flex; flex-direction: column; gap: 1.25rem; }
.auth-switch {
  text-align: center; margin-top: 1.75rem;
  font-size: 12px; color: var(--text-muted); font-weight: 300;
}
.auth-switch a { color: var(--gold); text-decoration: none; transition: color .2s; }
.auth-switch a:hover { color: var(--gold-lt); }

/* ── Responsive ───────────────────────────────────── */
@media (max-width: 768px) {
  .dashboard-nav { padding: 0 20px; }
  .dashboard-content { padding: 2rem 20px 4rem; }
  .user-email { display: none; }
  .welcome-card { padding: 1.5rem; flex-direction: column; gap: 1rem; text-align: center; }
  .auth-card { padding: 2rem 1.5rem; }
}

/* ── 공통 로고 (모든 페이지) ─────────────────────────── */
.pg-logo, .nb-logo, .nav-brand {
  display: flex; align-items: center; gap: 10px;
  text-decoration: none; flex-shrink: 0;
}
.pg-logo-mark, .nb-logo-mark, .brand-icon-sm {
  width: 28px; height: 28px;
  border: 1px solid rgba(154,120,64,.45);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--serif);
  font-size: 10px; color: #9a7840;
  background: transparent;
  flex-shrink: 0;
  transition: background .2s;
}
.pg-logo:hover .pg-logo-mark,
.nb-logo:hover .nb-logo-mark,
.nav-brand:hover .brand-icon-sm { background: rgba(154,120,64,.07); }
.pg-logo-name, .nb-logo-name, .nav-brand > span:last-child {
  font-family: var(--serif);
  font-size: 14px; font-weight: 400;
  letter-spacing: 2.5px; text-transform: uppercase;
  color: #12100e;
}
  </style>
  {% block extra_css %}{% endblock %}
</head>

  {% block content %}{% endblock %}

/* ── 전역 언어 적용 함수 ─────────────────────── */
window.PM_LANG = 'ko';
window.pmApplyI18n = function(code) {
  var t = window.PM_I18N[code] || window.PM_I18N.ko;
  window.PM_LANG = code;
  document.querySelectorAll('[data-i18n]').forEach(function(el) {
    var key = el.getAttribute('data-i18n');
    if (t[key] !== undefined) {
      var attr = el.getAttribute('data-i18n-attr');
      if (attr) {
        el.setAttribute(attr, t[key]);
      } else if (el.hasAttribute('placeholder')) {
        el.placeholder = t[key];
      } else if (el.hasAttribute('data-i18n-html')) {
        el.innerHTML = t[key];
      } else {
        el.textContent = t[key];
      }
    }
  });
  /* lang-code 표시 업데이트 */
  document.querySelectorAll('[data-lang-display]').forEach(function(el) {
    el.textContent = code.toUpperCase();
  });
  /* active lang-option */
  document.querySelectorAll('.lang-option[data-lang]').forEach(function(o) {
    o.classList.toggle('active', o.dataset.lang === code);
  });
  document.documentElement.lang = {ko:'ko',en:'en',ja:'ja',zh:'zh-Hans'}[code] || 'ko';
  try { localStorage.setItem('pm-lang', code); } catch(e) {}
  document.dispatchEvent(new CustomEvent('pm:i18n', { detail: { code: code, t: t } }));
};

/* 현재 언어의 번역 문자열을 가져오는 헬퍼 (동적으로 생성되는 문자열용) */
window.pmT = function(key) {
  var t = window.PM_I18N[window.PM_LANG] || window.PM_I18N.ko;
  return t[key] !== undefined ? t[key] : key;
};

/* ── 언어 스위처 이벤트 연결 (공통) ─────────── */
document.addEventListener('DOMContentLoaded', function() {
  /* lang-btn 클릭으로 드롭다운 열기/닫기 */
  document.querySelectorAll('.lang-btn').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      var switcher = btn.closest('.lang-switcher');
      switcher.classList.toggle('open');
    });
  });
  /* 바깥 클릭 시 닫기 */
  document.addEventListener('click', function() {
    document.querySelectorAll('.lang-switcher.open').forEach(function(s) {
      s.classList.remove('open');
    });
  });

  document.querySelectorAll('.lang-option[data-lang]').forEach(function(o) {
    o.addEventListener('click', function(e) {
      e.preventDefault();
      window.pmApplyI18n(o.dataset.lang);
      o.closest('.lang-switcher').classList.remove('open');
    });
  });
  var saved; try { saved = localStorage.getItem('pm-lang'); } catch(e) {}
  window.pmApplyI18n(saved || 'ko');
});
</script>
