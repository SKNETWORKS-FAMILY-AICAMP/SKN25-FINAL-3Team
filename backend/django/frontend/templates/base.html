<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block meta_description %}AI 기반 특허 청구항 자동 작성 서비스 PatentMind{% endblock %}">
    <title>{% block title %}PatentMind{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Animated Background Blobs -->
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="bg-blob blob-3"></div>

    <!-- Flash Messages -->
    {% if messages %}
    <div class="toast-container" id="toast-container">
        {% for message in messages %}
        <div class="toast toast-{{ message.tags }}" role="alert">
            <span class="toast-icon">
                {% if message.tags == 'success' %}✅{% elif message.tags == 'error' %}❌{% else %}ℹ️{% endif %}
            </span>
            <span class="toast-text">{{ message }}</span>
            <button class="toast-close" onclick="this.parentElement.remove()">✕</button>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <main>
        {% block content %}{% endblock %}
    </main>

    <script>
        // Auto-dismiss toasts after 4 seconds
        document.addEventListener('DOMContentLoaded', () => {
            const toasts = document.querySelectorAll('.toast');
            toasts.forEach((toast, i) => {
                setTimeout(() => {
                    toast.style.animation = 'slideOutRight 0.4s ease forwards';
                    setTimeout(() => toast.remove(), 400);
                }, 4000 + i * 300);
            });
        });
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
