{% extends 'base.html' %}
{% block extra_css %}
<style>
:root {
  --lf-bg:     #ffffff;
  --lf-bg2:    #faf8f4;
  --lf-navy:   #12100e;
  --lf-body:   #3d3830;
  --lf-mid:    #7c756e;
  --lf-muted:  #b8b0a8;
  --lf-gold:   #9a7840;
  --lf-gold-lt:#b8935a;
  --lf-border: rgba(0,0,0,.08);
  --lf-serif:  'DM Serif Display','Noto Serif KR',Georgia,serif;
  --lf-sans:   'Pretendard Variable','Pretendard','Noto Sans KR',-apple-system,sans-serif;
  --lf-ease:   cubic-bezier(.25,.46,.45,.94);
}
*, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
.pg { font-family: var(--lf-sans); background: var(--lf-bg); color: var(--lf-navy); min-height: 100vh; }
.pg-container { max-width: 1100px; margin: 0 auto; padding: 0 64px; }

/* ── Header ──────────────────────────────────────── */
.pg-header {
  position: sticky; top: 0; z-index: 600;
  background: rgba(255,255,255,.95); backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--lf-border);
}
.pg-nav {
  max-width: 1100px; margin: 0 auto; padding: 0 64px; height: 64px;
  display: flex; align-items: center; gap: 0;
}
.pg-logo {
  display: flex; align-items: center; gap: 10px; text-decoration: none; margin-right: 40px; flex-shrink: 0;
}
.pg-logo-mark {
  width: 28px; height: 28px; border: 1px solid rgba(154,120,64,.4);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--lf-serif); font-size: 10px; color: var(--lf-gold);
}
.pg-logo-name {
  font-family: var(--lf-serif); font-size: 14px; font-weight: 400;
  letter-spacing: 2.5px; text-transform: uppercase; color: var(--lf-navy);
}
.pg-gnb { display: flex; align-items: center; flex: 1; gap: 0; }
.pg-gnb-item { position: relative; height: 64px; display: flex; align-items: center; }
.pg-gnb-a {
  font-size: 10px; font-weight: 500; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--lf-mid);
  text-decoration: none; padding: 0 16px; height: 64px;
  display: flex; align-items: center; gap: 5px;
  transition: color .2s;
}
.pg-gnb-a:hover, .pg-gnb-a.active { color: var(--lf-navy); }
.pg-gnb-a.active { border-bottom: 2px solid var(--lf-gold); }
.pg-gnb-chev { transition: transform .2s; }
.pg-gnb-item:hover .pg-gnb-chev { transform: rotate(180deg); }
/* dropdown */
.pg-drop {
  display: none; position: absolute; top: 100%; left: 0;
  background: #fff; border: 1px solid var(--lf-border);
  border-radius: 6px; padding: .5rem; min-width: 180px;
  box-shadow: 0 16px 40px rgba(0,0,0,.1); z-index: 800;
}
.pg-drop--wide { min-width: 220px; }
.pg-gnb-item:hover .pg-drop { display: block; }
.pg-drop-inner { display: flex; flex-direction: column; gap: 2px; }
.pg-drop-a {
  display: flex; align-items: center; gap: 8px;
  padding: .45rem .75rem; border-radius: 4px;
  font-size: 12px; font-weight: 400; color: var(--lf-body);
  text-decoration: none; transition: background .15s, color .15s;
  background: none; border: none; cursor: pointer; width: 100%; text-align: left;
}
.pg-drop-a:hover { background: var(--lf-bg2); color: var(--lf-navy); }
.pg-drop-a--cta { color: var(--lf-gold); font-weight: 600; }
.pg-drop-a--hl  { color: var(--lf-gold); }
.pg-drop-num { font-size: 9px; color: var(--lf-muted); width: 16px; flex-shrink: 0; }
.pg-drop-sep { height: 1px; background: var(--lf-border); margin: .4rem .75rem; }
.pg-drop-logout { font-family: inherit; }
.pg-util { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.pg-btn-back {
  font-size: 10px; font-weight: 500; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--lf-mid);
  text-decoration: none; transition: color .2s;
}
.pg-btn-back:hover { color: var(--lf-navy); }
.pg-btn-cta {
  font-size: 10px; font-weight: 600; letter-spacing: 1.8px;
  text-transform: uppercase; color: var(--lf-gold);
  text-decoration: none; padding: .4rem 1rem;
  border: 1px solid rgba(154,120,64,.3);
  transition: all .2s;
}
.pg-btn-cta:hover { background: rgba(154,120,64,.06); border-color: var(--lf-gold); }

/* lang-switcher (light override) */
.pg .lang-switcher { position: relative; }
.pg .lang-btn { border-color: rgba(0,0,0,.12); color: var(--lf-mid); font-size:10px; letter-spacing:1.4px; background: transparent; }
.pg .lang-btn:hover { border-color: rgba(154,120,64,.4); color: var(--lf-gold); }
.pg .lang-dropdown { background: #fff; border-color: rgba(0,0,0,.08); box-shadow: 0 16px 40px rgba(0,0,0,.1); }
.pg .lang-option { color: var(--lf-body); }
.pg .lang-option:hover, .pg .lang-option.active { background: var(--lf-bg2); color: var(--lf-navy); }
.pg .lang-code { color: var(--lf-muted); }
.pg .lang-option.active .lang-code { color: var(--lf-gold); }

/* ── Page Hero ───────────────────────────────────── */
.pg-hero {
  padding: 80px 0 64px;
  background: var(--lf-bg);
  border-bottom: 1px solid var(--lf-border);
  position: relative; overflow: hidden;
}
.pg-hero .pg-container { position: relative; z-index: 1; }
.pg-hero-deco {
  position: absolute; top: 0; right: -20px; width: 50%; height: 100%;
  opacity: 0.13; pointer-events: none; z-index: 0;
  display: flex; align-items: center; justify-content: flex-end;
}
.pg-hero-deco svg { width: 100%; height: 100%; }
.pg-hero-tag {
  font-size: 9px; font-weight: 500; letter-spacing: 3.5px;
  text-transform: uppercase; color: var(--lf-gold); margin-bottom: 16px; display: block;
}
.pg-hero-h1 {
  font-family: var(--lf-serif); font-size: clamp(36px, 5vw, 64px);
  font-weight: 300; color: var(--lf-navy); letter-spacing: -1px; line-height: 1.1;
  margin-bottom: 20px;
}
.pg-hero-h1 em { font-style: italic; color: var(--lf-gold); }
.pg-hero-rule { width: 48px; height: 2px; background: var(--lf-gold); margin-bottom: 24px; }
.pg-hero-desc {
  font-size: 16px; font-weight: 300; color: var(--lf-body);
  line-height: 1.9; max-width: 600px;
}
.pg-team-brand {
  font-size: 22px; font-weight: 600; color: var(--lf-gold);
  letter-spacing: -0.3px;
}

/* ── Content ─────────────────────────────────────── */
.pg-body { padding: 72px 0 100px; }

/* ── Footer ──────────────────────────────────────── */
.pg-footer {
  background: #f4f0e8; padding: 36px 0;
  border-top: 1px solid var(--lf-border);
}
.pg-footer-inner {
  display: flex; align-items: center; justify-content: space-between;
  gap: 24px;
}
.pg-footer-logo {
  font-family: var(--lf-serif); font-size: 14px; letter-spacing: 2.5px;
  text-transform: uppercase; color: var(--lf-muted);
}
.pg-footer-copy { font-size: 11px; color: var(--lf-muted); }

@media (max-width: 768px) {
  .pg-container, .pg-nav { padding: 0 24px; }
  .pg-hero { padding: 60px 0 48px; }
  .pg-gnb { display: none; }
}
</style>
{% endblock %}
