<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="580" height="760" viewBox="0 0 580 760">
<defs>
  <marker id="fa-arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#222"/></marker>
</defs>
<rect x="0" y="0" width="580" height="760" fill="#fff"/>
<rect x="4" y="4" width="572" height="752" fill="#fff" stroke="#444" stroke-width="1.8"/>
<rect x="10" y="10" width="560" height="740" fill="none" stroke="#ccc" stroke-width="0.6"/>
<text x="290" y="33" font-family="'Courier New',monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">도 2  동작 흐름도</text>
<line x1="14" y1="43" x2="566" y2="43" stroke="#999" stroke-width="0.8"/>
<!-- 시작 (둥근 사각형) -->
<rect x="185" y="58" width="210" height="44" rx="22" fill="#f0f0f0" stroke="#222" stroke-width="1.8"/>
<text x="290" y="76" font-family="Arial,sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">시작</text>
<text x="290" y="92" font-family="Arial,sans-serif" font-size="9" text-anchor="middle" fill="#666">START (S10)</text>
<!-- S10 → S20 -->
<line x1="290" y1="102" x2="290" y2="132" stroke="#222" stroke-width="1.5" marker-end="url(#fa-arr)"/>
<!-- S20: 데이터 입력 -->
<rect x="170" y="132" width="240" height="48" rx="2" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="290" y="152" font-family="Arial,sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">입력 데이터 수신</text>
<text x="290" y="168" font-family="Arial,sans-serif" font-size="9" text-anchor="middle" fill="#666">Receive Input Data (S20)</text>
<!-- S20 → S30 -->
<line x1="290" y1="180" x2="290" y2="210" stroke="#222" stroke-width="1.5" marker-end="url(#fa-arr)"/>
<!-- S30: 유효성 검사 (마름모) -->
<polygon points="290,210 410,265 290,320 170,265" fill="#fafafa" stroke="#222" stroke-width="1.8"/>
<text x="290" y="261" font-family="Arial,sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">유효성 검사</text>
<text x="290" y="276" font-family="Arial,sans-serif" font-size="9" text-anchor="middle" fill="#666">Valid? (S30)</text>
<!-- YES 분기 (아래) -->
<text x="308" y="342" font-family="Arial,sans-serif" font-size="10" fill="#333">YES</text>
<line x1="290" y1="320" x2="290" y2="358" stroke="#222" stroke-width="1.5" marker-end="url(#fa-arr)"/>
<!-- NO 분기 (왼쪽) -->
<text x="118" y="259" font-family="Arial,sans-serif" font-size="10" fill="#333">NO</text>
<line x1="170" y1="265" x2="80" y2="265" stroke="#222" stroke-width="1.5"/>
<line x1="80" y1="265" x2="80" y2="156" stroke="#222" stroke-width="1.5"/>
<line x1="80" y1="156" x2="170" y2="156" stroke="#222" stroke-width="1.5" marker-end="url(#fa-arr)"/>
<!-- S40: 전처리 -->
<rect x="170" y="358" width="240" height="48" rx="2" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="290" y="378" font-family="Arial,sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">데이터 전처리</text>
<text x="290" y="394" font-family="Arial,sans-serif" font-size="9" text-anchor="middle" fill="#666">Preprocessing (S40)</text>
<!-- S40 → S50 -->
<line x1="290" y1="406" x2="290" y2="436" stroke="#222" stroke-width="1.5" marker-end="url(#fa-arr)"/>
<!-- S50: 분석 처리 -->
<rect x="170" y="436" width="240" height="48" rx="2" fill="#f5f5f5" stroke="#111" stroke-width="2.2"/>
<text x="290" y="456" font-family="Arial,sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">핵심 처리 연산</text>
<text x="290" y="472" font-family="Arial,sans-serif" font-size="9" text-anchor="middle" fill="#555">Core Processing (S50)</text>
<!-- S50 → S60 -->
<line x1="290" y1="484" x2="290" y2="514" stroke="#222" stroke-width="1.5" marker-end="url(#fa-arr)"/>
<!-- S60: 결과 판단 (마름모) -->
<polygon points="290,514 410,569 290,624 170,569" fill="#fafafa" stroke="#222" stroke-width="1.8"/>
<text x="290" y="565" font-family="Arial,sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">결과 검증</text>
<text x="290" y="580" font-family="Arial,sans-serif" font-size="9" text-anchor="middle" fill="#666">Pass? (S60)</text>
<!-- YES 분기 (아래) -->
<text x="308" y="648" font-family="Arial,sans-serif" font-size="10" fill="#333">YES</text>
<line x1="290" y1="624" x2="290" y2="660" stroke="#222" stroke-width="1.5" marker-end="url(#fa-arr)"/>
<!-- NO 분기 (오른쪽 → S50 재처리) -->
<text x="428" y="563" font-family="Arial,sans-serif" font-size="10" fill="#333">NO</text>
<line x1="410" y1="569" x2="492" y2="569" stroke="#222" stroke-width="1.5"/>
<line x1="492" y1="569" x2="492" y2="460" stroke="#222" stroke-width="1.5"/>
<line x1="492" y1="460" x2="410" y2="460" stroke="#222" stroke-width="1.5" marker-end="url(#fa-arr)"/>
<!-- S70: 결과 출력 -->
<rect x="170" y="660" width="240" height="48" rx="2" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="290" y="680" font-family="Arial,sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">결과 출력</text>
<text x="290" y="696" font-family="Arial,sans-serif" font-size="9" text-anchor="middle" fill="#666">Output Result (S70)</text>
<!-- 종료 -->
<line x1="290" y1="708" x2="290" y2="724" stroke="#222" stroke-width="1.5" marker-end="url(#fa-arr)"/>
<rect x="185" y="724" width="210" height="14" rx="7" fill="#f0f0f0" stroke="#444" stroke-width="1.4"/>
<text x="290" y="734" font-family="Arial,sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#555">종료  END</text>
<!-- 타이틀 블록 -->
<line x1="14" y1="718" x2="566" y2="718" stroke="#888" stroke-width="0.8"/>
</svg>
