name: Unit Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # 실제 DB/Redis 연결 없이 mock으로 실행합니다.
      DATABASE_URL: postgresql://test:test@localhost/test_db
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen --only-group shared --only-group fastapi --only-group dev

      - name: Run unit tests
        run: uv run pytest -v --tb=short
