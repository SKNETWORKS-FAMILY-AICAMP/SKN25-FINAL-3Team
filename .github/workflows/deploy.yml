name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. 서버의 프로젝트 폴더로 이동
            cd /home/ubuntu/SKN25-FINAL-3Team
            
            # 2. 최신 코드 받아오기
            git pull origin main
            
            # 🌟 3. 리액트(Vite) 프론트엔드 자동 빌드 (새로 추가된 부분!)
            echo "🚀 React 프론트엔드 빌드 시작..."
            cd frontend
            npm install
            npm run build
            cd ..
            
            # 4. 도커 컨테이너 재빌드 및 재시작 (장고 & FastAPI 백엔드)
            echo "🐳 백엔드 도커 컨테이너 재시작..."
            sudo docker-compose down --remove-orphans
            sudo docker-compose up -d --build 

            # 5. django 마이그레이션
            sudo docker exec patent_django_web python backend/django/manage.py migrate
            
            # 6. 정적 파일 다시 모으기 (관리자 페이지 디자인 깨짐 방지)
            sudo docker exec patent_django_web python backend/django/manage.py collectstatic --noinput

            # 🌟 7. NGINX 재시작 (새로 빌드된 리액트 화면과 라우팅 설정 즉시 반영)
            sudo service nginx restart
            echo "✅ 프론트엔드 및 백엔드 자동 배포가 성공적으로 완료되었습니다!"