[project]
name = "skn25-final-3team-patent-ai"
version = "0.1.0"
description = "AI/software patent agent service skeleton"
requires-python = ">=3.11"
dependencies = [
    "django==5.0.6",
    "djangorestframework==3.14.0",
    "djangorestframework-simplejwt==5.5.1",
    "fastapi>=0.111",
    "httpx>=0.27",
    "numpy>=1.26",
    "olefile>=0.47",
    "openai>=1.0",
    "pillow>=10.3",
    "psycopg2-binary>=2.9",
    "pydantic>=2.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "sqlalchemy>=2.0",
    "streamlit>=1.35",
    "uvicorn[standard]>=0.29",
    "pgvector>=0.3.0",
    "redis>=5.0"
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
