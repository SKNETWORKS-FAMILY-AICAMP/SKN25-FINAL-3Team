[project]
name = "skn25-final-3team-patent-ai"
version = "0.1.0"
description = "AI/software patent agent service skeleton"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
shared = [
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
]
agents = [
    "langchain-openai>=0.1",
    "langgraph>=0.1",
    "graphviz>=0.20",
    "openai>=1.0",
    "pydantic>=2.0",
    "pillow>=10.3",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "olefile>=0.47",
    "numpy>=1.26",
]
django = [
    {include-group = "agents"},
    "django==5.0.6",
    "djangorestframework==3.14.0",
    "djangorestframework-simplejwt==5.5.1",
    "django-cors-headers>=4.0",
    "gunicorn>=22.0",
    "whitenoise>=6.0",
]
fastapi = [
    "fastapi>=0.111",
    "httpx>=0.27",
    "numpy>=1.26",
    "olefile>=0.47",
    "openai>=1.0",
    "pillow>=10.3",
    "pydantic>=2.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "requests>=2.31",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "streamlit>=1.35",
    "uvicorn[standard]>=0.29",
    "pgvector>=0.3.0",
    "redis>=5.0",
]
dev = [
    {include-group = "shared"},
    {include-group = "fastapi"},
    {include-group = "django"},
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "pytest-asyncio>=0.24",
    "pytest-django>=4.8",
    "ruff>=0.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = [".", "backend/django"]
addopts = "--import-mode=importlib"
DJANGO_SETTINGS_MODULE = "config.test_settings"

[tool.ruff]
line-length = 100
