# =============================================================================
# Patent AI — Docker Compose
# =============================================================================
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │                      목표 아키텍처 (Target Architecture)                 │
# │                                                                         │
# │  [Browser]                                                              │
# │    └── :3000 ──► frontend  (React SPA)                                  │
# │                   ├── /api/*  → proxy → fastapi:8080                   │
# │                   └── /auth/* → proxy → django:8000                    │
# │                                                                         │
# │  [django :8000]   JWT 인증 전용 (회원가입·로그인·토큰 갱신)               │
# │    └── ──► postgres:5432  (accounts 테이블)                             │
# │                                                                         │
# │  [fastapi :8080]  멀티에이전트 파이프라인 + 비즈니스 로직 전담            │
# │    ├── POST /api/pipeline/run       — 파이프라인 실행                    │
# │    ├── POST /api/pipeline/continue  — 이어서 실행                       │
# │    ├── POST /api/agents/{name}/run  — 단일 agent 실행                   │
# │    ├── GET  /api/runs/{run_id}      — 실행 상태·결과 조회                │
# │    ├── ──► postgres:5432   (patent_runs 테이블)                         │
# │    ├── ──► redis:6379      (실시간 진행상황)                             │
# │    └── ──► claim-api:8001  (--profile llm)                             │
# │                                                                         │
# │  [claim-api :8010]  GPU 전용 Critic Agent  ← --profile llm             │
# │    ├── POST /critique                                                   │
# │    └── GET  /health                                                     │
# │    모델: EXAONE-3.0-7.8B + LoRA (silverstone1004/claim)                 │
# │                                                                         │
# │  [postgres :5432]  단일 DB (patent_ai)                                  │
# │    ├── Django auth 테이블  (accounts_user, django_*, token_blacklist)    │
# │    ├── patent_corpus      (선행기술 벡터, 1536-dim embedding)            │
# │    └── patent_runs        (파이프라인 실행 기록)                         │
# │                                                                         │
# │  [redis :6379]  파이프라인 진행상황 실시간 추적                           │
# └─────────────────────────────────────────────────────────────────────────┘
#
# -----------------------------------------------------------------------------
# 실행 방법
# -----------------------------------------------------------------------------
#
#   기본 (postgres + redis + django + fastapi + frontend):
#     docker compose up --build        # .env 에 OPENAI_API_KEY 필수
#
#   Critic Agent 포함 (EXAONE GPU 필요):
#     docker compose --profile llm up --build
#
#   특허 코퍼스 DB 적재 (최초 1회):
#     docker compose run --rm fastapi \
#       python agents/priorart/load_corpus.py --dir data/raw/texts/patents_txt
#
# -----------------------------------------------------------------------------
# 필수 환경변수 (.env)
# -----------------------------------------------------------------------------
#   OPENAI_API_KEY        필수
#   DB_USER               기본값: patent
#   DB_PASSWORD           기본값: patent_pw   ← 프로덕션에서 반드시 변경
#   DB_NAME               기본값: patent_ai
#   SECRET_KEY            기본값: dev용 키    ← 프로덕션에서 반드시 변경
#   HUGGINGFACE_TOKEN     --profile llm 시 필수
#   CLAIM_BACKEND_URL     외부 RunPod URL 지정 시 사용 (비우면 내부 claim-api)

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL + pgvector — 공유 데이터베이스
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-patent_ai}
      POSTGRES_USER:     ${DB_USER:-patent}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-patent_pw}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-patent} -d ${DB_NAME:-patent_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Django — JWT 인증 전용 백엔드
  # ---------------------------------------------------------------------------
  # 역할: 회원가입 · 로그인 · 토큰 갱신 · 토큰 블랙리스트
  # 엔드포인트:
  #   POST /api/auth/signup/
  #   POST /api/auth/login/
  #   POST /api/auth/logout/
  #   POST /api/auth/token/refresh/
  #   GET  /api/auth/me/
  django:
    build:
      context: .
      dockerfile: docker/Dockerfile.django
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      SECRET_KEY:         ${SECRET_KEY:-django-insecure-change-this-in-production-key-12345}
      DEBUG:              ${DEBUG:-True}
      DJANGO_DB_ENGINE:   django.db.backends.postgresql
      DJANGO_DB_NAME:     ${DB_NAME:-patent_ai}
      DJANGO_DB_USER:     ${DB_USER:-patent}
      DJANGO_DB_PASSWORD: ${DB_PASSWORD:-patent_pw}
      DJANGO_DB_HOST:     postgres
      DJANGO_DB_PORT:     "5432"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health/"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 3

  # ---------------------------------------------------------------------------
  # Redis — 파이프라인 진행상황 실시간 추적
  # ---------------------------------------------------------------------------
  # 역할: run:{run_id}:agent 키에 현재 실행 중인 agent 이름을 TTL 1일로 저장
  #       장애 시에도 파이프라인은 정상 실행 (예외 무시 처리됨)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # FastAPI — 멀티에이전트 파이프라인 API
  # ---------------------------------------------------------------------------
  # DB 마이그레이션은 alembic upgrade head 로 처리 후 uvicorn 기동
  fastapi:
    build:
      context: .
      dockerfile: docker/Dockerfile.fastapi
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head &&
      uvicorn backend.fastapi.app.main:app --host 0.0.0.0 --port 8080 --reload"
    environment:
      OPENAI_API_KEY:    ${OPENAI_API_KEY:?OPENAI_API_KEY 를 .env 에 설정하세요}
      OPENAI_MODEL:      ${OPENAI_MODEL:-gpt-4o}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      DATABASE_URL:      postgresql://${DB_USER:-patent}:${DB_PASSWORD:-patent_pw}@postgres:5432/${DB_NAME:-patent_ai}
      REDIS_URL:         redis://redis:6379/0
      CLAIM_BACKEND_URL: ${CLAIM_BACKEND_URL:-http://claim-api:8001}
      CORS_ORIGINS:      ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - .:/app
      - uploads:/app/data/tmp

  # ---------------------------------------------------------------------------
  # React Frontend — SPA (개발 서버)
  # ---------------------------------------------------------------------------
  # 프록시 (vite.config.ts):
  #   /api/*  → fastapi:8080
  #   /auth/* → django:8000
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      target: dev       # 프로덕션: prod 으로 변경
    restart: unless-stopped
    environment:
      FASTAPI_URL: http://fastapi:8080
      DJANGO_URL:  http://django:8000
    ports:
      - "3000:3000"
    depends_on:
      fastapi:
        condition: service_healthy
      django:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # ---------------------------------------------------------------------------
  # Critic Agent — GPU 전용 claim 품질 판단 서비스
  # ---------------------------------------------------------------------------
  # 시작: docker compose --profile llm up
  # 주의: 첫 시작 시 EXAONE 모델 다운로드 (~16GB). HF_CACHE 볼륨으로 재사용.
  #
  # GPU 지원 (nvidia-container-toolkit 설치 후 아래 deploy 블록 주석 해제):
  # deploy:
  #   resources:
  #     reservations:
  #       devices:
  #         - driver: nvidia
  #           count: 1
  #           capabilities: [gpu]
  claim-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.claim
    restart: unless-stopped
    command: uvicorn agents.runpod.main:app --host 0.0.0.0 --port 8001 --workers 1
    environment:
      OPENAI_API_KEY:    ${OPENAI_API_KEY:?OPENAI_API_KEY 를 .env 에 설정하세요}
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:?HUGGINGFACE_TOKEN 을 .env 에 설정하세요}
      LORA_HF_REPO:      ${LORA_HF_REPO:-silverstone1004/claim}
    ports:
      - "8010:8001"
    profiles:
      - llm
    volumes:
      - hf_cache:/root/.cache/huggingface

volumes:
  postgres_data:
  uploads:
  hf_cache:

networks:
  default:
    name: patent-net
