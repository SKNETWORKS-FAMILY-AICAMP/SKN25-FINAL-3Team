{% load static %}

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PatentAI</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <header>
        <div class="logo">PatentAI</div>

        <nav>
            <a href="#">서비스 소개</a>
            <a href="#">기능</a>
            <a href="#">문의</a>
            <a href="/accounts/login/" class="login-btn">로그인</a>
            <a href="/accounts/signup/" class="login-btn">회원가입</a>
        </nav>
    </header>

    <section class="hero">

        <div class="hero-content">

            <h1>
                AI 기반<br>
                특허 명세서 작성 플랫폼
            </h1>

            <p>
                발명가와 변리사를 위한 스마트 특허 문서 생성 서비스.<br>
                아이디어 입력만으로 명세서 초안을 빠르게 생성합니다.
            </p>

            <div class="buttons">
                <button class="start-btn">지금 시작하기</button>
                <button class="demo-btn">데모 보기</button>
            </div>

        </div>

    </section>

    <section class="features">

        <div class="card">
            <h2>AI 자동 생성</h2>
            <p>
                발명 내용을 입력하면 특허 명세서 초안을 자동 생성합니다.
            </p>
        </div>

        <div class="card">
            <h2>변리사 협업</h2>
            <p>
                작성된 문서를 변리사와 함께 검토 및 수정할 수 있습니다.
            </p>
        </div>

        <div class="card">
            <h2>빠른 문서화</h2>
            <p>
                반복적인 문서 작업 시간을 획기적으로 단축합니다.
            </p>
        </div>

    </section>

</body>
</html>
