<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>

    <style>
        body {
            background: #0f172a;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;

            font-family: Arial;
        }

        .login-box {
            background: #1e293b;
            padding: 40px;
            border-radius: 20px;
            width: 380px;
        }

        h1 {
            margin-bottom: 30px;
            text-align: center;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #cbd5e1;
        }

        .field input {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 10px;

            background: #0f172a;
            color: white;

            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;

            background: #38bdf8;

            border: none;
            border-radius: 10px;

            font-weight: bold;
            cursor: pointer;

            margin-top: 10px;
        }

        button:hover {
            background: #0ea5e9;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>로그인</h1>

        <form method="post">
            {% csrf_token %}

            <div class="field">
                <label>아이디</label>
                {{ form.username }}
            </div>

            <div class="field">
                <label>비밀번호</label>
                {{ form.password }}
            </div>

            <button type="submit">로그인</button>

        </form>

    </div>
    {% if messages %}
    <script>
        {% for message in messages %}
            alert("{{ message }}");
        {% endfor %}
    </script>
    {% endif %}


</body>
</html>
