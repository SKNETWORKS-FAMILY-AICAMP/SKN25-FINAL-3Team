{% load static %}

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>

    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    <style>
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            margin-bottom: 20px;
        }
        .radio-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: white;
            font-size: 15px;
        }
        .radio-label input[type="radio"] {
            width: auto; /* 기존 auth.css의 width: 100% 덮어쓰기 */
            margin: 0;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>회원가입</h1>

        <form method="POST">
            {% csrf_token %}

            <div class="field">
                <label>가입 유형</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="role" value="inventor" checked>
                        발명가 (특허 초안 작성)
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="role" value="attorney">
                        변리사 (전문가 검토)
                    </label>
                </div>
            </div>
            <div class="field">
                <label>아이디</label>
                {{ form.username }}
            </div>

            <div class="field">
                <label>비밀번호</label>
                {{ form.password1 }}
            </div>

            <div class="field">
                <label>비밀번호 확인</label>
                {{ form.password2 }}
            </div>

            <button type="submit" class="btn">가입하기</button>

        </form>

        <a class="login-link" href="/accounts/login/">이미 계정이 있으신가요? 로그인</a>

    </div>

    <div class="info">

        <h2>AI 특허 명세서 작성 서비스</h2>

        <p>
            발명 아이디어를 입력하면<br>
            AI가 특허 명세서 초안을 생성합니다.
        </p>

        <ul>
            <li>✔ 8자 이상 비밀번호</li>
            <li>✔ 일반적으로 사용되지 않는 비밀번호</li>
            <li>✔ 비밀번호에는 특수문자를 넣어주세요</li>
            <li>✔ 개인정보와 유사하면 안됨</li>
        </ul>

    </div>

</div>

</body>
</html>
