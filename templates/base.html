{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PatentAI{% endblock %}</title>
    
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>

    <header>
        <div class="logo"><a href="/" style="text-decoration: none; color: #38bdf8;">PatentAI</a></div>

        <nav>
            <a href="#">서비스 소개</a>
            <a href="#">기능</a>
            <a href="#">문의</a>
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}" style="color: #38bdf8; font-weight: bold;">대시보드</a>
                <form action="{% url 'logout' %}" method="post" style="display: inline;">
                    {% csrf_token %}
                    <button type="submit" style="background: none; border: 1px solid #38bdf8; color: white; padding: 10px 18px; border-radius: 8px; cursor: pointer;">로그아웃</button>
                </form>
            {% else %}
                <a href="/accounts/login/" class="login-btn">로그인</a>
                <a href="/accounts/signup/" class="login-btn">회원가입</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    {% block extra_js %}{% endblock %}
</body>
</html>
