server {
    server_name skn25-final-3team.duckdns.org;

    # 🌟 1. 리액트 (Vite) 프론트엔드 화면 서빙
    location / {
        root /home/ubuntu/SKN25-FINAL-3Team/frontend/dist; 
        index index.html;
        try_files $uri $uri/ /index.html; 
    }

    # ✂️ 2. 프론트엔드의 /auth/ 요청 가로채기 (마법의 구간)
    # 프론트가 /auth/accounts/login/ 으로 보내면, 
    # NGINX가 맨 앞의 /auth/ 를 잘라내고 /accounts/login/ 으로 장고에게 보냅니다!
    location /auth/ {
        rewrite ^/auth/(.*)$ /$1 break;
        
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 스트리밍 유지
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
    }

    # 🛡️ 3. 장고 서버 본연의 API 주소들 (혹시 몰라 열어두는 장고 직통 라인)
    location ~ ^/(admin|accounts|workspace|api)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 스트리밍 유지
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
    }

    # 🚀 3. 프론트엔드의 /api/v1/ 요청 가로채기 (FastAPI로 연결)
    location /api/v1/ {
        # 프론트가 /api/v1/patent-search 로 보내면,
        # NGINX가 앞의 /api/v1/을 잘라내고 /patent-search 로 FastAPI에게 보냅니다.
        rewrite ^/api/v1/(.*)$ /$1 break;
        
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 📂 4. 장고 정적 파일 (Static/Media) 서빙
    location /media/ {
        alias /home/ubuntu/SKN25-FINAL-3Team/backend/django/media/;
    }

    location /static/ {
        alias /home/ubuntu/SKN25-FINAL-3Team/backend/django/staticfiles/;
    }

    # ========================================================
    # 🔒 Certbot SSL 설정 (절대 건드리지 마세요!)
    # ========================================================
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/skn25-final-3team.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/skn25-final-3team.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    # 🔄 HTTP -> HTTPS 자동 리다이렉트
    if ($host = skn25-final-3team.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name skn25-final-3team.duckdns.org;
    return 404; # managed by Certbot
}