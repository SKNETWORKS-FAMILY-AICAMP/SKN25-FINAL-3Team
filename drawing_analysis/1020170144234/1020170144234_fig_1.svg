<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
<defs>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L9,4.5 L0,9 z" fill="#111"/>
  </marker>
  <marker id="arr-open" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M0,1 L8,4.5 L0,8" fill="none" stroke="#111" stroke-width="1.3"/>
  </marker>
  <marker id="arr-dash" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L9,4.5 L0,9 z" fill="#555"/>
  </marker>
</defs>

<!-- background -->
<rect x="0" y="0" width="1200" height="780" fill="#ffffff"/>

<!-- title -->
<text x="600.0" y="42.0" font-family="NanumGothic, Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#111">도 1  일 실시예에 따른 사용자 입력에 기반한 문장을 제공하는 장치를 설명하기 위한 블록도이다</text>

<!-- main dashed rectangle (장치 1000) -->
<rect x="110.0" y="105.0" width="1005.0" height="595.0" rx="0" ry="0" fill="#fff" stroke="#111" stroke-width="2.0" stroke-dasharray="10 5"/>
<text x="612.5" y="131.0" font-family="NanumGothic, Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#111">장치</text>

<!-- 1000 reference label: above main rect, centered -->
<text x="612.5" y="83.0" font-family="NanumGothic, Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#111">1000</text>
<line x1="612.5" y1="92.6" x2="612.5" y2="105.0" stroke="#111" stroke-width="1.0" fill="none"/>

<!-- 메모리 box -->
<rect x="170.0" y="190.0" width="215.0" height="75.0" rx="2" ry="2" fill="#fff" stroke="#111" stroke-width="2.2"/>
<text x="277.5" y="227.5" font-family="NanumGothic, Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#111">메모리</text>

<!-- 1100 reference label: above 메모리 box, pointing straight down -->
<text x="277.5" y="160.0" font-family="NanumGothic, Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#111">1100</text>
<line x1="277.5" y1="169.5" x2="277.5" y2="190.0" stroke="#111" stroke-width="1.0" fill="none"/>

<!-- 제어부 box -->
<rect x="835.0" y="190.0" width="215.0" height="75.0" rx="2" ry="2" fill="#fff" stroke="#111" stroke-width="2.2"/>
<text x="942.5" y="227.5" font-family="NanumGothic, Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#111">제어부</text>

<!-- 1200 reference label: above 제어부 box, pointing straight down -->
<text x="942.5" y="160.0" font-family="NanumGothic, Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#111">1200</text>
<line x1="942.5" y1="169.5" x2="942.5" y2="190.0" stroke="#111" stroke-width="1.0" fill="none"/>

<!-- 입출력부 box -->
<rect x="170.0" y="580.0" width="215.0" height="75.0" rx="2" ry="2" fill="#fff" stroke="#111" stroke-width="2.2"/>
<text x="277.5" y="617.5" font-family="NanumGothic, Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#111">입출력부</text>

<!-- 1300 reference label: right side of 입출력부, horizontal leader line -->
<text x="460.0" y="617.5" font-family="NanumGothic, Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#111">1300</text>
<line x1="442.0" y1="617.5" x2="385.0" y2="617.5" stroke="#111" stroke-width="1.0" fill="none"/>

<!-- Arrow: 메모리 → 제어부 (horizontal) -->
<line x1="385.0" y1="227.5" x2="835.0" y2="227.5" stroke="#111" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
<!-- Arrow label: below the arrow line, with white background -->
<rect x="553.0" y="236.0" width="120.0" height="20.0" fill="#ffffff"/>
<text x="613.0" y="246.0" font-family="NanumGothic, Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444">프로그램 제공</text>

<!-- Arrow: 제어부 → 입출력부 (L-shaped polyline) -->
<polyline points="942.5,265.0 942.5,558.0 277.5,558.0 277.5,580.0" stroke="#111" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
<!-- Arrow label: right of vertical segment, with white background -->
<rect x="955.0" y="401.0" width="90.0" height="21.0" fill="#ffffff"/>
<text x="1000.0" y="411.5" font-family="NanumGothic, Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444">문장 제공</text>

</svg>
